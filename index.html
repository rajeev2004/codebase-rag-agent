<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>codebase/agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root{
    --ink:#11151c;
    --panel:#1a212c;
    --paper:#f1ecdf;
    --brass:#d1954a;
    --text:#e7e3d8;
    --muted:#99a2b2;
    --line:#2b3340;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:15px;
    line-height:1.6;
    padding:clamp(28px, 6vw, 72px) clamp(20px, 6vw, 32px) 120px;
  }

  .page{
    max-width:640px;
    margin:0 auto;
  }

  .wordmark{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(28px, 5vw, 36px);
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }
  .wordmark .slash{ color:var(--brass); font-style:italic; }

  .tagline{
    margin:0 0 40px;
    color:var(--muted);
    font-size:14px;
    max-width:46ch;
    min-height:20px;
  }

  .inquiry{
    position:relative;
    display:flex;
    align-items:flex-end;
    gap:14px;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
  }
  .inquiry::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:1px;
    background:var(--brass);
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .25s ease;
  }
  .inquiry:focus-within::after{ transform:scaleX(1); }

  #ask_question{
    flex:1;
    background:none;
    border:none;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    padding:6px 2px;
    outline:none;
  }
  #ask_question::placeholder{ color:#515a68; }

  #answerBtn{
    background:none;
    border:1px solid var(--line);
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    padding:9px 16px;
    cursor:pointer;
    border-radius:3px;
    transition:border-color .15s ease, color .15s ease;
  }
  #answerBtn:hover:not(:disabled){ border-color:var(--brass); color:var(--brass); }
  #answerBtn:disabled{ color:var(--muted); cursor:default; }

  #ask_question:focus-visible, #answerBtn:focus-visible{
    outline:2px solid var(--brass);
    outline-offset:2px;
  }

  .status{
    display:flex;
    align-items:center;
    gap:8px;
    min-height:20px;
    margin:16px 0 0;
    color:var(--muted);
    font-size:13px;
  }
  .status .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--brass);
  }
  .status[data-state="loading"] .dot{ animation:pulse 1.1s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){
    .status[data-state="loading"] .dot{ animation:none; }
  }
  @keyframes pulse{
    0%,100%{ opacity:.35; }
    50%{ opacity:1; }
  }

  #result{ margin-top:36px; }
  #result[hidden]{ display:none; }

  .divider{
    height:1px;
    background:var(--line);
    transform:scaleX(0);
    transform-origin:left;
    margin-bottom:28px;
  }
  #result.reveal .divider{ animation:draw .5s ease forwards; }
  @media (prefers-reduced-motion: reduce){
    #result.reveal .divider{ animation:none; transform:scaleX(1); }
  }
  @keyframes draw{ to{ transform:scaleX(1); } }

  .finding h2, .exhibits h2{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:14px;
    color:var(--brass);
    margin:0 0 14px;
  }

  .answer_body{
    max-width:70ch;
    font-size:15px;
    line-height:1.7;
  }
  .answer_body p{ margin:0 0 14px; }
  .answer_body ul, .answer_body ol{ padding-left:20px; margin:0 0 14px; }
  .answer_body li{ margin-bottom:6px; }
  .answer_body strong{ color:#fff; }
  .answer_body h1, .answer_body h2, .answer_body h3{
    font-family:'Fraunces', serif; font-weight:600; color:var(--text);
    font-size:17px; margin:22px 0 10px;
  }
  .answer_body code{
    background:var(--paper); color:#2a2416;
    padding:2px 5px; border-radius:2px; font-size:13px;
  }
  .answer_body pre{
    background:var(--paper); color:#2a2416;
    padding:16px; border-radius:4px; overflow-x:auto;
    margin:14px 0; font-size:13px; line-height:1.55;
  }
  .answer_body pre code{ background:none; padding:0; }
  .answer_body table{ border-collapse:collapse; margin:14px 0; font-size:13px; }
  .answer_body th, .answer_body td{ border:1px solid var(--line); padding:6px 10px; text-align:left; }

  .exhibits{ margin-top:36px; }
  .exhibits[hidden]{ display:none; }
  .sources{ list-style:none; margin:0; padding:0; }
  .sources li{
    display:flex; gap:12px;
    padding:8px 0;
    border-top:1px solid var(--line);
    font-size:13px;
  }
  .sources li:last-child{ border-bottom:1px solid var(--line); }
  .sources .tag{ color:var(--brass); flex-shrink:0; }
  .sources .dir{ color:var(--muted); word-break:break-all; }
  .sources .file{ color:var(--text); }

  .visually-hidden{
    position:absolute; width:1px; height:1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;
  }

  @media (max-width:480px){
    body{ font-size:14px; }
    .inquiry{ flex-direction:column; align-items:stretch; }
    #answerBtn{ align-self:flex-start; }
  }
</style>
</head>
<body>
  <main class="page">
    <header>
      <h1 class="wordmark"></h1>
      <p class="tagline"></p>
    </header>

    <form class="inquiry" onsubmit="return false">
      <label class="visually-hidden" for="ask_question">Ask a question about the codebase</label>
      <input id="ask_question" name="ask_question" placeholder="What does processClaimWebhook do?" maxlength="500" autocomplete="off" />
      <button id="answerBtn" type="button" onclick="answerQuestion()">Ask</button>
    </form>

    <p class="status" role="status"></p>

    <section id="result" hidden>
      <div class="divider"></div>
      <div class="finding">
        <h2>Finding</h2>
        <div class="answer_body"></div>
      </div>
      <div class="exhibits" hidden>
        <h2>Exhibits</h2>
        <ol class="sources"></ol>
      </div>
    </section>
  </main>

  <script>
    const API_BASE_URL = 'http://127.0.0.1:8003';
    const PROJECT_NAME = 'codebase/agent'; // change this per project, e.g. 'abhi/chord', 'openshorts/clips'
    const session_id = `session-${Date.now()}`;

    function renderWordmark(name){
      const el = document.querySelector('.wordmark');
      if (name.includes('/')) {
        el.innerHTML = name.split('/').map((p, i) => i === 0 ? p : `<span class="slash">/</span>${p}`).join('');
      } else {
        el.textContent = name;
      }
    }

    function getGreeting(){
      const hour = new Date().getHours();
      const pools = {
        lateNight:    ["Still up? The codebase doesn't mind — ask away.", "Quiet hours. Good time to dig into something that's been bugging you."],
        earlyMorning: ["You're up early. Let's get ahead of today's first question.", "Morning, early riser. What are we looking into first?"],
        morning:      ["Good morning. Where do you want to start?", "Fresh coffee, fresh questions — let's go."],
        midday:       ["Midday check-in. What's on your mind?", "Lunch-break investigation — ask anything."],
        afternoon:    ["Afternoon slump? Let the codebase do the explaining.", "Still going strong. What are we tracking down?"],
        evening:      ["Evening session. Let's chase down a loose end.", "Winding down the day — one more question?"],
        night:        ["Burning the midnight oil a little early tonight.", "Late one, huh? Let's make it quick and useful."]
      };
      let bucket;
      if (hour < 4) bucket = pools.lateNight;
      else if (hour < 7) bucket = pools.earlyMorning;
      else if (hour < 11) bucket = pools.morning;
      else if (hour < 14) bucket = pools.midday;
      else if (hour < 18) bucket = pools.afternoon;
      else if (hour < 22) bucket = pools.evening;
      else bucket = pools.night;
      return bucket[Math.floor(Math.random() * bucket.length)];
    }

    document.title = PROJECT_NAME;
    renderWordmark(PROJECT_NAME);
    document.querySelector('.tagline').textContent = getGreeting();

    const input = document.getElementById('ask_question');
    const btn = document.getElementById('answerBtn');
    const statusEl = document.querySelector('.status');
    const resultEl = document.getElementById('result');
    const answerBody = document.querySelector('.answer_body');
    const exhibitsEl = document.querySelector('.exhibits');
    const sourcesList = document.querySelector('.sources');

    input.addEventListener('keypress', function(e){
      if(e.key === 'Enter'){ answerQuestion(); }
    });

    function setStatus(text, state){
      statusEl.innerHTML = '';
      if(state === 'loading'){
        const dot = document.createElement('span');
        dot.className = 'dot';
        statusEl.appendChild(dot);
        statusEl.setAttribute('data-state','loading');
      } else {
        statusEl.removeAttribute('data-state');
      }
      if(text){ statusEl.appendChild(document.createTextNode(text)); }
    }

    function revealResult(){
      resultEl.hidden = false;
      resultEl.classList.remove('reveal');
      void resultEl.offsetWidth;
      resultEl.classList.add('reveal');
    }

    async function answerQuestion(){
      const question = input.value;
      if (!question.trim()) return;

      btn.disabled = true;
      btn.textContent = 'Asking…';
      setStatus('Reading the codebase…', 'loading');
      answerBody.innerHTML = '';
      sourcesList.innerHTML = '';
      exhibitsEl.hidden = true;
      resultEl.hidden = true;

      try{
        const response = await fetch(`${API_BASE_URL}/ask`, {
          method: 'POST',
          headers: {'content-type':'application/json'},
          body: JSON.stringify({question: question, session_id: session_id})
        });
        const data = await response.json();
        if(!response.ok){
          setStatus(typeof data.detail === 'string' ? data.detail : 'Please enter a question under 500 characters');
          return;
        }

        answerBody.innerHTML = marked.parse(data.answer);

        if (data.sources && data.sources.length){
          data.sources.forEach((source, i) => {
            const li = document.createElement('li');
            const tag = document.createElement('span');
            tag.className = 'tag';
            tag.textContent = String(i + 1).padStart(2, '0');
            const path = document.createElement('span');
            const lastSlash = source.lastIndexOf('/');
            if (lastSlash === -1){
              path.innerHTML = `<span class="file">${source}</span>`;
            } else {
              path.innerHTML = `<span class="dir">${source.slice(0, lastSlash + 1)}</span><span class="file">${source.slice(lastSlash + 1)}</span>`;
            }
            li.appendChild(tag);
            li.appendChild(path);
            sourcesList.appendChild(li);
          });
          exhibitsEl.hidden = false;
        }

        revealResult();
        setStatus('');
      }catch(err){
        setStatus('⚠ Could not reach the server. Is it running?');
      }finally{
        btn.disabled = false;
        btn.textContent = 'Ask';
      }
    }
  </script>
</body>
</html>
